// Body Control Module (BCM) service contract used on the in-vehicle
// Ethernet backbone between the Telematics/Gateway ECU (TCU-GW-2) and
// the Body ECU (BCM-4). Plaintext HTTP/2 on port 50051 on the bench.
syntax = "proto3";

package vehicle.body.v1;

service BodyControl {
  // Actuate the central locking system. Blocks until the actuator reports.
  rpc SetDoorLock (DoorLockRequest) returns (CommandAck);
  // Start/stop the HVAC pre-conditioning with a target temperature.
  rpc SetClimate (ClimateRequest) returns (CommandAck);
  // Start/stop a charging session (AC on-board charger).
  rpc SetCharging (ChargingRequest) returns (CommandAck);
  // Snapshot of the Body ECU state (polled by the gateway every few seconds).
  rpc GetBodyState (StateRequest) returns (BodyState);
  // Liveness supervision, issued by the gateway on a fixed period.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  // Bench-only: return the ECU to factory defaults between test cases.
  rpc ResetState (ResetRequest) returns (CommandAck);
}

enum LockAction {
  LOCK_ACTION_UNSPECIFIED = 0;
  LOCK = 1;
  UNLOCK = 2;
}

enum ClimateAction {
  CLIMATE_ACTION_UNSPECIFIED = 0;
  CLIMATE_START = 1;
  CLIMATE_STOP = 2;
}

enum ChargingAction {
  CHARGING_ACTION_UNSPECIFIED = 0;
  CHARGING_START = 1;
  CHARGING_STOP = 2;
}

enum ChargingState {
  CHARGING_STATE_UNSPECIFIED = 0;
  IDLE = 1;
  CHARGING = 2;
  COMPLETE = 3;
  FAULT = 4;
}

enum AckResult {
  ACK_RESULT_UNSPECIFIED = 0;
  OK = 1;
  REJECTED = 2;
  ACTUATOR_ERROR = 3;
}

message DoorLockRequest {
  string request_id = 1;   // end-to-end correlation id, generated by the backend
  LockAction action = 2;
}

message ClimateRequest {
  string request_id = 1;
  ClimateAction action = 2;
  // Target cabin temperature encoded as raw signal: 0.5 degC per LSB, offset 0.
  // 44 -> 22.0 degC, 45 -> 22.5 degC. Valid range 32..56 (16.0..28.0 degC).
  int32 target_temp_raw = 3;
}

message ChargingRequest {
  string request_id = 1;
  ChargingAction action = 2;
  int32 target_soc_percent = 3;
}

message CommandAck {
  string request_id = 1;
  AckResult result = 2;
  string detail = 3;
  // ECU monotonic time in ms when the actuation completed.
  int64 ecu_timestamp_ms = 4;
}

message StateRequest {}

message ClimateState {
  bool active = 1;
  int32 target_temp_raw = 2;   // same encoding as ClimateRequest
  int32 cabin_temp_raw = 3;
}

message ChargingStatus {
  ChargingState state = 1;
  int32 soc_percent = 2;
  int32 target_soc_percent = 3;
  int32 power_kw_x10 = 4;      // 0.1 kW per LSB
}

message BodyState {
  bool doors_locked = 1;
  ClimateState climate = 2;
  ChargingStatus charging = 3;
  int64 ecu_uptime_ms = 4;
  uint32 state_seq = 5;        // increments on every state change
}

message HeartbeatRequest {
  uint32 seq = 1;
  int64 gateway_timestamp_ms = 2;
}

message HeartbeatResponse {
  uint32 seq = 1;
  int64 ecu_timestamp_ms = 2;
  string ecu_sw_version = 3;
}

message ResetRequest {
  string reason = 1;
}
